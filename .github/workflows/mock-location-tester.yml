name: Build Mock Location Tester APK

on:
  push:
    paths:
      - "mock-location-tester/**"
      - ".github/workflows/mock-location-tester.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mock-location-tester
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: mock-location-tester-debug-apk
          path: mock-location-tester/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

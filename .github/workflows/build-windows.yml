name: Build Windows installer

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: 'Publish a GitHub Release (v<package version>) with the installer attached'
        type: boolean
        default: false

# Only the release step needs to write; everything else is read-only.
permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build installer
        run: npm run dist
        env:
          # no code-signing certificate is configured
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Self-test the unpacked app
        shell: pwsh
        run: |
          $exe = Join-Path $PWD 'dist\win-unpacked\File Compressor.exe'
          $out = Join-Path $env:RUNNER_TEMP 'selftest-unpacked.json'
          $p = Start-Process -FilePath $exe -ArgumentList "--self-test=$out" -Wait -PassThru
          if (Test-Path $out) { Get-Content $out }
          if ($p.ExitCode -ne 0) { throw "Self-test failed (exit code $($p.ExitCode))" }

      - name: Install the real installer silently and self-test the installed app
        shell: pwsh
        run: |
          $installer = (Get-ChildItem dist\FileCompressor-Setup-*.exe | Select-Object -First 1).FullName
          Write-Host "Installer: $installer ($([math]::Round((Get-Item $installer).Length / 1MB, 1)) MB)"
          $dir = Join-Path $env:RUNNER_TEMP 'fc-install'
          Start-Process -FilePath $installer -ArgumentList '/S', "/D=$dir" -Wait
          $exe = Join-Path $dir 'File Compressor.exe'
          if (-not (Test-Path $exe)) { throw "Installer did not create $exe" }
          $out = Join-Path $env:RUNNER_TEMP 'selftest-installed.json'
          $p = Start-Process -FilePath $exe -ArgumentList "--self-test=$out" -Wait -PassThru
          if (Test-Path $out) { Get-Content $out }
          if ($p.ExitCode -ne 0) { throw "Installed app self-test failed (exit code $($p.ExitCode))" }

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: FileCompressor-Windows-Installer
          path: dist/FileCompressor-Setup-*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $v = (Get-Content package.json | ConvertFrom-Json).version
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', steps.version.outputs.version) }}
          target_commitish: ${{ github.sha }}
          name: File Compressor v${{ steps.version.outputs.version }}
          body: |
            Windows installer for File Compressor.

            1. Download **FileCompressor-Setup-${{ steps.version.outputs.version }}.exe** below.
            2. Run it. If Windows shows "Windows protected your PC", click **More info → Run anyway** (the installer isn't code-signed).
            3. Open **File Compressor** from the Start menu or desktop.
          files: dist/FileCompressor-Setup-*.exe
          fail_on_unmatched_files: true
